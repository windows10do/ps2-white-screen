name: Build PS2 White Screen ELF

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            patch \
            texinfo \
            flex \
            bison

      - name: Download PS2DEV toolchain
        run: |
          git clone https://github.com/ps2dev/ps2dev.git ~/ps2dev

      - name: Build PS2DEV toolchain
        run: |
          cd ~/ps2dev
          export PS2DEV=$HOME/ps2dev
          export PATH=$PS2DEV/bin:$PATH
          ./build-all.sh

      - name: Create PS2 project
        run: |
          mkdir -p ps2_white_screen

          cat > ps2_white_screen/main.c <<'EOF'
          #include <tamtypes.h>
          #include <kernel.h>
          #include <debug.h>

          int main(void)
          {
              init_scr();
              scr_clear();

              scr_printf(
                  "This is a white screen. Restart your console to exit."
              );

              while (1)
              {
                  nopdelay();
              }

              return 0;
          }
          EOF

      - name: Compile ELF
        run: |
          export PS2DEV=$HOME/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PATH

          cd ps2_white_screen

          ee-gcc \
            -T$PS2SDK/ee/startup/linkfile \
            -o white_screen.elf \
            main.c \
            -ldebug \
            -lkernel

      - name: Copy ELF to repository
        run: |
          mkdir -p output
          cp ps2_white_screen/white_screen.elf output/

      - name: Commit ELF binary
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add output/white_screen.elf

          git commit \
            -m "Build PS2 white screen ELF" \
            || echo "No changes"

          git push
