name: Build PS2 White Screen ELF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PS2 project
        run: |
          mkdir -p ps2_white_screen

          printf '%s\n' \
          '#include <tamtypes.h>' \
          '#include <kernel.h>' \
          '#include <debug.h>' \
          '' \
          'int main(void)' \
          '{' \
          '    init_scr();' \
          '    scr_clear();' \
          '' \
          '    scr_printf("This is a white screen. Restart your console to exit.");' \
          '' \
          '    while(1)' \
          '    {' \
          '        nopdelay();' \
          '    }' \
          '' \
          '    return 0;' \
          '}' \
          > ps2_white_screen/main.c

      - name: Compile ELF
        run: |
          mkdir -p output

          ee-gcc \
            -O2 \
            ps2_white_screen/main.c \
            -o output/white_screen.elf \
            -ldebug \
            -lkernel

      - name: Commit ELF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/white_screen.elf

          git commit -m "Build PS2 white screen ELF" || echo "No changes"

          git push
