name: Build PS2 White Screen ELF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ps2dev/ps2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find PS2 compiler
        run: |
          find / -name ee-gcc 2>/dev/null || true

      - name: Setup PS2DEV paths
        run: |
          EE_GCC=$(find / -name ee-gcc 2>/dev/null | head -n 1)

          if [ -z "$EE_GCC" ]; then
            echo "ee-gcc not found"
            exit 1
          fi

          EE_BIN=$(dirname "$EE_GCC")
          PS2DEV=$(dirname "$(dirname "$EE_BIN")")

          echo "PS2DEV=$PS2DEV" >> $GITHUB_ENV
          echo "PS2SDK=$PS2DEV/ps2sdk" >> $GITHUB_ENV

          echo "$EE_BIN" >> $GITHUB_PATH

      - name: Check compiler
        run: |
          which ee-gcc
          ee-gcc --version

      - name: Create PS2 source
        run: |
          mkdir -p ps2_white_screen

          printf '%s\n' \
          '#include <tamtypes.h>' \
          '#include <kernel.h>' \
          '#include <debug.h>' \
          '#include <graph.h>' \
          '' \
          'int main(void)' \
          '{' \
          '    init_scr();' \
          '    scr_clear();' \
          '' \
          '    scr_printf("This is a white screen. Restart your console to exit.");' \
          '' \
          '    while(1)' \
          '    {' \
          '        nopdelay();' \
          '    }' \
          '' \
          '    return 0;' \
          '}' \
          > ps2_white_screen/main.c

      - name: Compile ELF
        run: |
          mkdir -p output

          ee-gcc \
            -O2 \
            ps2_white_screen/main.c \
            -o output/white_screen.elf \
            -ldebug \
            -lkernel

      - name: Commit ELF binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/white_screen.elf

          git commit -m "Build PS2 white screen ELF" || echo "No changes"

          git push
