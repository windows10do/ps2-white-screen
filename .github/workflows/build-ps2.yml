name: Build PS2 White Screen ELF

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            make \
            gcc \
            g++ \
            cmake \
            patch \
            texinfo \
            flex \
            bison \
            wget \
            curl \
            unzip \
            python3 \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev

      - name: Download PS2DEV
        run: |
          git clone --depth=1 https://github.com/ps2dev/ps2dev.git $HOME/ps2dev

      - name: Setup PS2DEV environment
        run: |
          echo "PS2DEV=$HOME/ps2dev" >> $GITHUB_ENV
          echo "PS2SDK=$HOME/ps2dev/ps2sdk" >> $GITHUB_ENV
          echo "$HOME/ps2dev/bin" >> $GITHUB_PATH
          echo "$HOME/ps2dev/ee/bin" >> $GITHUB_PATH
          echo "$HOME/ps2dev/iop/bin" >> $GITHUB_PATH
          echo "$HOME/ps2dev/dvp/bin" >> $GITHUB_PATH

      - name: Build PS2DEV toolchain
        run: |
          cd $HOME/ps2dev

          chmod +x build-all.sh

          ./build-all.sh

      - name: Create PS2 project
        run: |
          mkdir -p ps2_white_screen

          cat > ps2_white_screen/main.c <<'EOF'
#include <tamtypes.h>
#include <kernel.h>
#include <debug.h>

int main(void)
{
    init_scr();

    scr_clear();

    scr_printf(
        "This is a white screen. Restart your console to exit."
    );

    while (1)
    {
        nopdelay();
    }

    return 0;
}
EOF

      - name: Compile PS2 ELF
        run: |
          cd ps2_white_screen

          ee-gcc \
            -O2 \
            -o white_screen.elf \
            main.c \
            -ldebug \
            -lkernel

      - name: Put ELF into repository
        run: |
          mkdir -p output
          cp ps2_white_screen/white_screen.elf output/

      - name: Commit generated ELF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/white_screen.elf

          git commit \
            -m "Build PS2 white screen ELF" \
            || echo "No changes to commit"

          git push
